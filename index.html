<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Tablet FlightSim 3D - Fixed Airport + Gear + Momentum + Spoilers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: #88cdf8;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #hud {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      padding: 11px 13px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.50);
      color: white;
      font-size: 13px;
      line-height: 1.45;
      z-index: 10;
      min-width: 220px;
      backdrop-filter: blur(7px);
    }

    #hud b {
      color: #9ee7ff;
    }

    #status {
      margin-top: 5px;
      color: #ffe58a;
      font-weight: bold;
    }

    #message {
      position: fixed;
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,0.62);
      color: white;
      z-index: 80;
      font-weight: bold;
      display: none;
      max-width: 88vw;
      text-align: center;
      font-size: 14px;
    }

    #controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .panel {
      pointer-events: auto;
      position: absolute;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(8px);
      color: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 8px;
      font-weight: bold;
      color: white;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.96);
    }

    button.active {
      background: #1fbb58;
    }

    button.warn {
      background: #c94747;
    }

    button.holdActive {
      background: #ff922b;
    }

    #buttonPanel {
      left: max(12px, env(safe-area-inset-left));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 126px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #yokePanel {
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: 250px;
      height: 208px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #yokeBase {
      position: relative;
      width: 168px;
      height: 168px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15), rgba(0,0,0,0.27));
      border: 2px solid rgba(255,255,255,0.25);
    }

    #yoke {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 128px;
      height: 128px;
      transform: translate(-50%, -50%);
      transition: transform 0.035s linear;
    }

    .yoke-arm {
      position: absolute;
      background: #20242a;
      border: 3px solid #5f6d7a;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.4);
    }

    .arm-left {
      width: 80px;
      height: 22px;
      left: 0;
      top: 36px;
      border-radius: 18px;
      transform: rotate(-25deg);
    }

    .arm-right {
      width: 80px;
      height: 22px;
      right: 0;
      top: 36px;
      border-radius: 18px;
      transform: rotate(25deg);
    }

    .arm-down {
      width: 24px;
      height: 82px;
      left: 52px;
      top: 48px;
      border-radius: 18px;
    }

    .yoke-center {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #323944;
      border: 4px solid #748394;
      box-shadow: inset 0 0 12px rgba(255,255,255,0.15);
    }

    #yokeHint {
      position: absolute;
      bottom: 7px;
      font-size: 11px;
      color: rgba(255,255,255,0.82);
    }

    #throttlePanel {
      right: max(12px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: 86px;
      height: 250px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #throttleLabel {
      font-size: 12px;
      opacity: 0.9;
    }

    #throttleTrack {
      position: relative;
      width: 34px;
      height: 178px;
      border-radius: 99px;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.25);
    }

    #throttleFill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      border-radius: 99px;
      background: linear-gradient(to top, #29d34d, #ffe15a, #ff5d5d);
    }

    #throttleKnob {
      position: absolute;
      left: 50%;
      bottom: 0%;
      width: 52px;
      height: 28px;
      transform: translate(-50%, 50%);
      border-radius: 8px;
      background: #f4f4f4;
      border: 2px solid #555;
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
    }

    #throttleValue {
      font-size: 13px;
      font-weight: bold;
    }

    #rudderPanel {
      position: absolute;
      right: max(108px, calc(env(safe-area-inset-right) + 108px));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 150px;
      height: 72px;
      padding: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .rudderBtn {
      width: 58px;
      height: 48px;
      font-size: 22px;
    }

    #marketOverlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(5, 9, 18, 0.74);
      backdrop-filter: blur(8px);
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      color: white;
      overflow: auto;
    }

    #marketBox {
      width: min(980px, 96vw);
      margin: 0 auto;
      background: rgba(15, 22, 35, 0.94);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 38px rgba(0,0,0,0.45);
    }

    #marketHeader {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    #marketHeader h2 {
      font-size: 22px;
    }

    #marketGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .planeCard {
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 12px;
    }

    .planeCard.activeCard {
      outline: 2px solid #73e0ff;
      background: rgba(55, 155, 255, 0.18);
    }

    .planeName {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #eaf8ff;
    }

    .planeType {
      font-size: 12px;
      opacity: 0.78;
      margin-bottom: 10px;
    }

    .stat {
      margin: 7px 0;
      font-size: 12px;
    }

    .statLine {
      height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.16);
      overflow: hidden;
      margin-top: 4px;
    }

    .statFill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #55d98b, #65c7ff);
    }

    .planePrice {
      margin-top: 10px;
      font-weight: bold;
      color: #ffe58a;
    }

    .planeCard button {
      width: 100%;
      margin-top: 9px;
    }

    @media (max-width: 860px) {
      #marketGrid {
        grid-template-columns: repeat(2, 1fr);
      }

      #hud {
        font-size: 12px;
        min-width: 205px;
      }
    }

    @media (max-width: 640px) {
      #buttonPanel {
        width: 112px;
        gap: 6px;
        padding: 8px;
      }

      #buttonPanel button {
        padding: 8px 6px;
        font-size: 11px;
      }

      #yokePanel {
        width: 205px;
        height: 174px;
      }

      #yokeBase {
        width: 138px;
        height: 138px;
      }

      #yoke {
        transform: translate(-50%, -50%) scale(0.82);
      }

      #yokeHint {
        font-size: 10px;
      }

      #throttlePanel {
        width: 76px;
        height: 218px;
      }

      #throttleTrack {
        height: 148px;
      }

      #rudderPanel {
        right: 94px;
        width: 128px;
        height: 62px;
      }

      .rudderBtn {
        width: 48px;
        height: 42px;
      }

      #marketGrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div>Uçak: <b id="planeHud">Cessna 172</b></div>
    <div>Coin: <b id="coinsHud">0</b></div>
    <div>Hız: <b id="speed">0</b> km/h</div>
    <div>Yükseklik: <b id="altitude">0</b> m</div>
    <div>Gaz: <b id="throttleHud">0</b>%</div>
    <div>İniş Takımı: <b id="gearHud">Açık</b></div>
    <div>Spoiler: <b id="spoilerHud">Kapalı</b></div>
    <div>Brake: <b id="brakeHud">Kapalı</b></div>
    <div>Yaw Damper: <b id="yawHud">Açık</b></div>
    <div id="status">Park halinde</div>
  </div>

  <div id="message"></div>

  <div id="marketOverlay">
    <div id="marketBox">
      <div id="marketHeader">
        <div>
          <h2>Uçak Marketi</h2>
          <div>Uçarak coin kazan, uçak satın al ve seç.</div>
        </div>
        <button id="closeMarketBtn">Kapat</button>
      </div>
      <div id="marketGrid"></div>
    </div>
  </div>

  <div id="controls">
    <div id="buttonPanel" class="panel">
      <button id="engineBtn" class="active">Motor Açık</button>
      <button id="gearBtn" class="active">Gear Açık</button>
      <button id="spoilerBtn">Spoiler</button>
      <button id="brakeBtn">Brake</button>
      <button id="yawBtn" class="active">Yaw Damper</button>
      <button id="marketBtn">Market</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div id="yokePanel" class="panel">
      <div id="yokeBase">
        <div id="yoke">
          <div class="yoke-arm arm-left"></div>
          <div class="yoke-arm arm-right"></div>
          <div class="yoke-arm arm-down"></div>
          <div class="yoke-center"></div>
        </div>
      </div>
      <div id="yokeHint">Y direksiyon: çek = yüksel, it = alçal</div>
    </div>

    <div id="rudderPanel" class="panel">
      <button class="rudderBtn" id="rudderLeft">↶</button>
      <button class="rudderBtn" id="rudderRight">↷</button>
    </div>

    <div id="throttlePanel" class="panel">
      <div id="throttleLabel">GAZ</div>
      <div id="throttleTrack">
        <div id="throttleFill"></div>
        <div id="throttleKnob"></div>
      </div>
      <div id="throttleValue">0%</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
    const lowPowerDevice = isTouchDevice || (navigator.deviceMemory && navigator.deviceMemory <= 4);

    const canvas = document.getElementById("game");
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: !lowPowerDevice,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, lowPowerDevice ? 1.25 : 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = !lowPowerDevice;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8bd3ff);
    scene.fog = new THREE.Fog(0x8bd3ff, 500, 2800);

    const camera = new THREE.PerspectiveCamera(
      65,
      window.innerWidth / window.innerHeight,
      0.1,
      6500
    );

    const hemi = new THREE.HemisphereLight(0xffffff, 0x3f7647, 1.18);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffffff, 1.35);
    sun.position.set(230, 420, 180);
    sun.castShadow = !lowPowerDevice;
    sun.shadow.camera.left = -500;
    sun.shadow.camera.right = 500;
    sun.shadow.camera.top = 500;
    sun.shadow.camera.bottom = -500;
    sun.shadow.mapSize.width = lowPowerDevice ? 1024 : 2048;
    sun.shadow.mapSize.height = lowPowerDevice ? 1024 : 2048;
    scene.add(sun);

    const runwayDefs = [
      { type: "runway", x: 0, z: -420, rot: 0, length: 2100, width: 105, name: "18/36" },
      { type: "runway", x: 520, z: -900, rot: Math.PI * 0.34, length: 1400, width: 78, name: "09/27" }
    ];

    const taxiwayDefs = [
      { type: "taxi", x: -120, z: -430, rot: 0, length: 1500, width: 32 },
      { type: "taxi", x: -210, z: 160, rot: Math.PI / 2, length: 360, width: 34 },
      { type: "taxi", x: -210, z: -620, rot: Math.PI / 2, length: 320, width: 34 },
      { type: "taxi", x: 290, z: -610, rot: Math.PI * 0.34, length: 600, width: 30 }
    ];

    const apronDefs = [
      { type: "apron", x: -285, z: 170, rot: 0, length: 260, width: 280 },
      { type: "apron", x: 170, z: 205, rot: 0, length: 170, width: 150 }
    ];

    const allAirportSurfaces = [...runwayDefs, ...taxiwayDefs, ...apronDefs];

    const aircraftCatalog = [
      {
        id: "cessna172",
        name: "Cessna 172",
        type: "Başlangıç / Eğitim Uçağı",
        price: 0,
        maxSpeed: 230,
        accel: 5.4,
        drag: 0.000030,
        takeoffSpeed: 108,
        landingMax: 145,
        handling: 0.88,
        lift: 3.45,
        gravity: 3.25,
        climb: 1.00,
        brakePower: 10,
        reward: 1.0,
        groundClearance: 3.3,
        statSpeed: 35,
        statHandling: 88,
        statLift: 68
      },
      {
        id: "a320",
        name: "Airbus A320",
        type: "Yolcu Uçağı",
        price: 700,
        maxSpeed: 840,
        accel: 5.0,
        drag: 0.000010,
        takeoffSpeed: 235,
        landingMax: 265,
        handling: 0.48,
        lift: 4.15,
        gravity: 4.05,
        climb: 0.76,
        brakePower: 15,
        reward: 1.4,
        groundClearance: 4.4,
        statSpeed: 74,
        statHandling: 47,
        statLift: 82
      },
      {
        id: "b747",
        name: "Boeing 747",
        type: "Büyük Yolcu Uçağı",
        price: 1400,
        maxSpeed: 920,
        accel: 4.2,
        drag: 0.000009,
        takeoffSpeed: 285,
        landingMax: 295,
        handling: 0.32,
        lift: 4.55,
        gravity: 4.42,
        climb: 0.60,
        brakePower: 17,
        reward: 1.9,
        groundClearance: 5.9,
        statSpeed: 82,
        statHandling: 31,
        statLift: 95
      },
      {
        id: "f16",
        name: "F-16 Fighting Falcon",
        type: "Jet Savaş Uçağı",
        price: 2100,
        maxSpeed: 1500,
        accel: 13.5,
        drag: 0.000016,
        takeoffSpeed: 220,
        landingMax: 315,
        handling: 1.20,
        lift: 4.05,
        gravity: 3.95,
        climb: 1.55,
        brakePower: 19,
        reward: 2.4,
        groundClearance: 2.9,
        statSpeed: 100,
        statHandling: 96,
        statLift: 75
      },
      {
        id: "tb2",
        name: "Bayraktar TB2",
        type: "İHA / Uzun Kanat",
        price: 1100,
        maxSpeed: 220,
        accel: 3.6,
        drag: 0.000027,
        takeoffSpeed: 90,
        landingMax: 125,
        handling: 0.66,
        lift: 3.70,
        gravity: 3.35,
        climb: 0.72,
        brakePower: 8,
        reward: 1.7,
        groundClearance: 2.6,
        statSpeed: 30,
        statHandling: 66,
        statLift: 90
      }
    ];

    const saveKey = "tablet_flightsim_market_v3_fixed";
    let saveData = loadSave();

    function loadSave() {
      try {
        const parsed = JSON.parse(localStorage.getItem(saveKey));
        if (parsed && Array.isArray(parsed.owned)) return parsed;
      } catch {}
      return {
        coins: 250,
        owned: ["cessna172"],
        active: "cessna172"
      };
    }

    function saveGame() {
      localStorage.setItem(saveKey, JSON.stringify(saveData));
    }

    function getAircraft(id) {
      return aircraftCatalog.find(p => p.id === id) || aircraftCatalog[0];
    }

    if (!saveData.owned.includes("cessna172")) saveData.owned.push("cessna172");
    if (!saveData.owned.includes(saveData.active)) saveData.active = "cessna172";

    let currentAircraft = getAircraft(saveData.active);
    let airplane;

    const state = {
      throttle: 0,
      speed: 0,
      altitude: 0,
      pitch: 0,
      roll: 0,
      yaw: 0,
      yokeX: 0,
      yokeY: 0,
      rudder: 0,
      engineOn: true,
      gearDown: true,
      yawDamper: true,
      brake: false,
      spoilersManual: false,
      autoSpoilerTimer: 0,
      airborne: false,
      crashed: false,
      coinBuffer: 0,
      lastWasAirborne: false
    };

    const speedEl = document.getElementById("speed");
    const altEl = document.getElementById("altitude");
    const throttleHud = document.getElementById("throttleHud");
    const gearHud = document.getElementById("gearHud");
    const yawHud = document.getElementById("yawHud");
    const spoilerHud = document.getElementById("spoilerHud");
    const brakeHud = document.getElementById("brakeHud");
    const statusEl = document.getElementById("status");
    const messageEl = document.getElementById("message");
    const planeHud = document.getElementById("planeHud");
    const coinsHud = document.getElementById("coinsHud");

    const throttleTrack = document.getElementById("throttleTrack");
    const throttleFill = document.getElementById("throttleFill");
    const throttleKnob = document.getElementById("throttleKnob");
    const throttleValue = document.getElementById("throttleValue");

    const yokeBase = document.getElementById("yokeBase");
    const yoke = document.getElementById("yoke");

    const gearBtn = document.getElementById("gearBtn");
    const engineBtn = document.getElementById("engineBtn");
    const yawBtn = document.getElementById("yawBtn");
    const spoilerBtn = document.getElementById("spoilerBtn");
    const brakeBtn = document.getElementById("brakeBtn");
    const marketOverlay = document.getElementById("marketOverlay");
    const marketGrid = document.getElementById("marketGrid");

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.style.display = "block";
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => {
        messageEl.style.display = "none";
      }, 1800);
    }

    function surfaceLocal(x, z, s) {
      const dx = x - s.x;
      const dz = z - s.z;
      const c = Math.cos(-s.rot);
      const sn = Math.sin(-s.rot);
      return {
        x: dx * c - dz * sn,
        z: dx * sn + dz * c
      };
    }

    function airportBlendFor(x, z) {
      let best = 0;

      for (const s of allAirportSurfaces) {
        const local = surfaceLocal(x, z, s);
        const ax = Math.abs(local.x);
        const az = Math.abs(local.z);

        const sideSoftness = s.type === "runway" ? 90 : 42;
        const endSoftness = s.type === "runway" ? 120 : 45;

        const bx = 1 - smoothstep(s.width / 2, s.width / 2 + sideSoftness, ax);
        const bz = 1 - smoothstep(s.length / 2, s.length / 2 + endSoftness, az);

        best = Math.max(best, bx * bz);
      }

      return best;
    }

    function isOnAirportSurface(x, z) {
      for (const s of allAirportSurfaces) {
        const local = surfaceLocal(x, z, s);
        if (Math.abs(local.x) < s.width / 2 && Math.abs(local.z) < s.length / 2) {
          return true;
        }
      }
      return false;
    }

    function isOnRunway(x, z) {
      for (const s of runwayDefs) {
        const local = surfaceLocal(x, z, s);
        if (Math.abs(local.x) < s.width / 2 && Math.abs(local.z) < s.length / 2) {
          return true;
        }
      }
      return false;
    }

    function rawTerrainHeight(x, z) {
      const h1 = Math.sin(x * 0.004) * 8;
      const h2 = Math.cos(z * 0.0047) * 6;
      const h3 = Math.sin((x + z) * 0.0062) * 4;
      const h4 = Math.cos((x - z) * 0.0032) * 7;
      return h1 + h2 + h3 + h4 - 2;
    }

    function terrainHeightAt(x, z) {
      const blend = airportBlendFor(x, z);
      return rawTerrainHeight(x, z) * (1 - blend);
    }

    function groundContactY(x, z) {
      return terrainHeightAt(x, z) + currentAircraft.groundClearance;
    }

    function getSpoilersActive() {
      return state.spoilersManual || state.autoSpoilerTimer > 0;
    }

    function createTerrain() {
      const size = 4300;
      const segments = lowPowerDevice ? 88 : 150;
      const half = size / 2;

      const positions = [];
      const colors = [];
      const indices = [];
      const color = new THREE.Color();

      for (let iz = 0; iz <= segments; iz++) {
        for (let ix = 0; ix <= segments; ix++) {
          const x = -half + (ix / segments) * size;
          const z = -half + (iz / segments) * size;
          const y = terrainHeightAt(x, z);

          positions.push(x, y, z);

          const airport = airportBlendFor(x, z);
          const grassTone = 0.30 + Math.sin(x * 0.02 + z * 0.01) * 0.025;
          const lightness = clamp(0.34 + y * 0.006 + Math.sin((x - z) * 0.01) * 0.03, 0.25, 0.48);

          if (airport > 0.55) {
            color.setHSL(0.18, 0.08, 0.30);
          } else if (y > 12) {
            color.setHSL(0.22, 0.42, 0.38);
          } else if (y < -8) {
            color.setHSL(0.30, 0.45, 0.31);
          } else {
            color.setHSL(grassTone, 0.50, lightness);
          }

          colors.push(color.r, color.g, color.b);
        }
      }

      for (let iz = 0; iz < segments; iz++) {
        for (let ix = 0; ix < segments; ix++) {
          const a = iz * (segments + 1) + ix;
          const b = a + 1;
          const c = a + (segments + 1);
          const d = c + 1;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 1,
        flatShading: true
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    function addSurfacePlane(s, material, yOffset) {
      const group = new THREE.Group();
      group.position.set(s.x, yOffset, s.z);
      group.rotation.y = s.rot;

      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(s.width, s.length),
        material
      );

      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;
      group.add(plane);
      scene.add(group);

      return group;
    }

    function createAirportSurfaces() {
      const runwayMat = new THREE.MeshStandardMaterial({ color: 0x262626, roughness: 0.90 });
      const taxiMat = new THREE.MeshStandardMaterial({ color: 0x343434, roughness: 0.92 });
      const apronMat = new THREE.MeshStandardMaterial({ color: 0x3b3b3b, roughness: 0.94 });
      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const yellowMat = new THREE.MeshBasicMaterial({ color: 0xffd84d });
      const lightMat = new THREE.MeshBasicMaterial({ color: 0x9ee7ff });

      for (const s of apronDefs) {
        addSurfacePlane(s, apronMat, 0.235);
      }

      for (const s of taxiwayDefs) {
        const group = addSurfacePlane(s, taxiMat, 0.255);

        const yellow = new THREE.Mesh(new THREE.PlaneGeometry(3.2, s.length - 20), yellowMat);
        yellow.rotation.x = -Math.PI / 2;
        yellow.position.y = 0.022;
        group.add(yellow);
      }

      for (const r of runwayDefs) {
        const group = addSurfacePlane(r, runwayMat, 0.285);

        const centerCount = Math.floor(r.length / 90);
        for (let i = 0; i < centerCount; i++) {
          const z = -r.length / 2 + 60 + i * 90;
          const line = new THREE.Mesh(new THREE.PlaneGeometry(5, 40), whiteMat);
          line.rotation.x = -Math.PI / 2;
          line.position.set(0, 0.030, z);
          group.add(line);
        }

        for (const side of [-1, 1]) {
          const sideLine = new THREE.Mesh(
            new THREE.PlaneGeometry(2.2, r.length - 70),
            whiteMat
          );
          sideLine.rotation.x = -Math.PI / 2;
          sideLine.position.set(side * (r.width / 2 - 5), 0.036, 0);
          group.add(sideLine);

          for (let z = -r.length / 2 + 30; z < r.length / 2; z += 90) {
            const light = new THREE.Mesh(new THREE.SphereGeometry(1.0, 8, 6), lightMat);
            light.position.set(side * (r.width / 2 + 7), 0.9, z);
            group.add(light);
          }
        }

        for (const end of [-1, 1]) {
          for (let i = -4; i <= 4; i++) {
            const block = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 26), whiteMat);
            block.rotation.x = -Math.PI / 2;
            block.position.set(i * 7, 0.042, end * (r.length / 2 - 65));
            group.add(block);
          }
        }
      }
    }

    function createAirportObjects() {
      const hangarMat = new THREE.MeshStandardMaterial({ color: 0x89939e, roughness: 0.75 });
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x354457, roughness: 0.65 });
      const glassMat = new THREE.MeshStandardMaterial({
        color: 0x74c7ff,
        roughness: 0.2,
        transparent: true,
        opacity: 0.75
      });

      function box(size, pos, mat) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), mat);
        m.position.set(pos.x, terrainHeightAt(pos.x, pos.z) + pos.y, pos.z);
        m.castShadow = !lowPowerDevice;
        m.receiveShadow = true;
        scene.add(m);
        return m;
      }

      box({ x: 90, y: 24, z: 70 }, { x: -300, y: 12, z: 190 }, hangarMat);
      box({ x: 96, y: 9, z: 78 }, { x: -300, y: 31, z: 190 }, roofMat);

      box({ x: 70, y: 20, z: 55 }, { x: -190, y: 10, z: 105 }, hangarMat);
      box({ x: 76, y: 8, z: 62 }, { x: -190, y: 26, z: 105 }, roofMat);

      box({ x: 42, y: 18, z: 42 }, { x: 150, y: 9, z: 190 }, hangarMat);
      box({ x: 18, y: 74, z: 18 }, { x: 150, y: 37, z: 190 }, glassMat);
      box({ x: 34, y: 10, z: 34 }, { x: 150, y: 79, z: 190 }, roofMat);

      const treeCount = lowPowerDevice ? 70 : 150;
      const trunkGeo = new THREE.CylinderGeometry(0.7, 1.0, 8, 6);
      const crownGeo = new THREE.ConeGeometry(4.2, 12, 7);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6a4727, roughness: 1 });
      const crownMat = new THREE.MeshStandardMaterial({ color: 0x1e6b34, roughness: 1 });

      const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
      const crowns = new THREE.InstancedMesh(crownGeo, crownMat, treeCount);
      const dummy = new THREE.Object3D();

      let placed = 0;
      let attempts = 0;

      while (placed < treeCount && attempts < treeCount * 10) {
        attempts++;

        const x = (Math.random() - 0.5) * 3600;
        const z = (Math.random() - 0.5) * 3600;

        if (airportBlendFor(x, z) > 0.04) continue;

        const h = terrainHeightAt(x, z);
        const scale = 0.75 + Math.random() * 0.65;

        dummy.position.set(x, h + 4 * scale, z);
        dummy.scale.set(scale, scale, scale);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.updateMatrix();
        trunks.setMatrixAt(placed, dummy.matrix);

        dummy.position.set(x, h + 13 * scale, z);
        dummy.scale.set(scale, scale, scale);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.updateMatrix();
        crowns.setMatrixAt(placed, dummy.matrix);

        placed++;
      }

      trunks.count = placed;
      crowns.count = placed;
      trunks.castShadow = !lowPowerDevice;
      crowns.castShadow = !lowPowerDevice;
      scene.add(trunks);
      scene.add(crowns);
    }

    function createClouds() {
      const count = lowPowerDevice ? 18 : 32;
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1,
        transparent: true,
        opacity: 0.84
      });

      for (let i = 0; i < count; i++) {
        const group = new THREE.Group();
        const s = 18 + Math.random() * 30;

        for (let p = 0; p < 5; p++) {
          const puff = new THREE.Mesh(
            new THREE.SphereGeometry(s * (0.55 + Math.random() * 0.45), 14, 10),
            mat
          );
          puff.position.set(
            (Math.random() - 0.5) * s * 2.6,
            (Math.random() - 0.25) * s * 0.65,
            (Math.random() - 0.5) * s * 1.4
          );
          group.add(puff);
        }

        group.position.set(
          (Math.random() - 0.5) * 3200,
          160 + Math.random() * 420,
          -400 - Math.random() * 2600
        );

        scene.add(group);
      }
    }

    function mat(color, roughness = 0.45, metalness = 0.08) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    function addMesh(group, geometry, material, position, rotation, scale) {
      const mesh = new THREE.Mesh(geometry, material);
      if (position) mesh.position.set(position.x || 0, position.y || 0, position.z || 0);
      if (rotation) mesh.rotation.set(rotation.x || 0, rotation.y || 0, rotation.z || 0);
      if (scale) mesh.scale.set(scale.x || 1, scale.y || 1, scale.z || 1);
      mesh.castShadow = !lowPowerDevice;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function createWingPair(span, rootChord, tipChord, sweep, thickness, material) {
      const positions = [];
      const indices = [];

      function addHalf(side) {
        const base = positions.length / 3;
        const xRoot = 0;
        const xTip = side * span / 2;
        const yTop = thickness / 2;
        const yBottom = -thickness / 2;
        const rootLE = -rootChord / 2;
        const rootTE = rootChord / 2;
        const tipLE = -tipChord / 2 + sweep;
        const tipTE = tipChord / 2 + sweep;

        positions.push(
          xRoot, yTop, rootLE,
          xRoot, yTop, rootTE,
          xTip, yTop, tipLE,
          xTip, yTop, tipTE,
          xRoot, yBottom, rootLE,
          xRoot, yBottom, rootTE,
          xTip, yBottom, tipLE,
          xTip, yBottom, tipTE
        );

        indices.push(
          base + 0, base + 1, base + 3,
          base + 0, base + 3, base + 2,
          base + 4, base + 7, base + 5,
          base + 4, base + 6, base + 7,
          base + 0, base + 2, base + 6,
          base + 0, base + 6, base + 4,
          base + 1, base + 5, base + 7,
          base + 1, base + 7, base + 3,
          base + 2, base + 3, base + 7,
          base + 2, base + 7, base + 6
        );
      }

      addHalf(1);
      addHalf(-1);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      return new THREE.Mesh(geo, material);
    }

    function createGearGroup(size = 1) {
      const group = new THREE.Group();
      const dark = mat(0x121820, 0.75);
      const metal = mat(0xbfc7d1, 0.35, 0.35);

      function wheel(x, y, z, r) {
        addMesh(
          group,
          new THREE.CylinderGeometry(r, r, 0.7 * size, 16),
          dark,
          { x, y, z },
          { z: Math.PI / 2 }
        );

        addMesh(
          group,
          new THREE.CylinderGeometry(0.10 * size, 0.10 * size, 2.8 * size, 8),
          metal,
          { x, y: y + 1.3 * size, z }
        );
      }

      wheel(-3.4 * size, -2.1 * size, 2.7 * size, 0.72 * size);
      wheel(3.4 * size, -2.1 * size, 2.7 * size, 0.72 * size);
      wheel(0, -2.15 * size, -5.6 * size, 0.55 * size);

      return group;
    }

    function setupGearAnimation(gear, extendedY, retractAmount) {
      gear.position.y = extendedY;
      gear.userData.extendedY = extendedY;
      gear.userData.retractedY = extendedY + retractAmount;
      gear.userData.retractAmount = retractAmount;
    }

    function buildCessna() {
      const g = new THREE.Group();
      const body = mat(0xf0f3f7, 0.38);
      const red = mat(0xd73737, 0.42);
      const dark = mat(0x121820, 0.65);
      const glass = new THREE.MeshStandardMaterial({
        color: 0x78c9ff,
        roughness: 0.1,
        transparent: true,
        opacity: 0.72
      });

      addMesh(g, new THREE.CapsuleGeometry(1.45, 14, 10, 20), body, { z: 0 }, { x: Math.PI / 2 });
      addMesh(g, new THREE.ConeGeometry(1.45, 3.2, 20), body, { z: -8.6 }, { x: -Math.PI / 2 });
      addMesh(g, new THREE.SphereGeometry(1.35, 16, 10), glass, { y: 1.05, z: -3.9 }, null, { x: 1.05, y: 0.55, z: 1.2 });

      const wing = createWingPair(26, 4.2, 2.4, 0.2, 0.28, red);
      wing.position.set(0, 1.7, -1.2);
      g.add(wing);

      const tailWing = createWingPair(9, 2.5, 1.5, 0.1, 0.22, red);
      tailWing.position.set(0, 1.05, 7);
      g.add(tailWing);

      addMesh(g, new THREE.BoxGeometry(0.45, 4.8, 2.2), red, { y: 2.5, z: 6.7 }, { x: -0.14 });
      const prop = addMesh(g, new THREE.BoxGeometry(0.18, 7.5, 0.25), dark, { z: -10.35 }, { z: Math.PI / 2 });
      addMesh(g, new THREE.SphereGeometry(0.45, 10, 8), dark, { z: -10.15 });

      const gear = createGearGroup(0.9);
      setupGearAnimation(gear, -0.55, 4.5);
      g.add(gear);

      g.userData.engineParts = [prop];
      g.userData.gearGroup = gear;
      g.scale.setScalar(1.05);
      return g;
    }

    function createAircraftModel(id) {
      let model;

      if (id === "a320") model = buildA320();
      else if (id === "b747") model = buildB747();
      else if (id === "f16") model = buildF16();
      else if (id === "tb2") model = buildTB2();
      else model = buildCessna();

      model.rotation.order = "YXZ";
      return model;
    }

    function resetPlane(show = true) {
      state.throttle = 0;
      state.speed = 0;
      state.altitude = 0;
      state.pitch = 0;
      state.roll = 0;
      state.yaw = 0;
      state.yokeX = 0;
      state.yokeY = 0;
      state.rudder = 0;
      state.brake = false;
      state.spoilersManual = false;
      state.autoSpoilerTimer = 0;
      state.airborne = false;
      state.lastWasAirborne = false;
      state.crashed = false;
      state.gearDown = true;

      const startX = 0;
      const startZ = 670;
      airplane.position.set(startX, groundContactY(startX, startZ), startZ);
      airplane.rotation.set(0, 0, 0);

      const gear = airplane.userData.gearGroup;
      if (gear) {
        gear.position.y = gear.userData.extendedY;
        gear.visible = true;
      }

      updateThrottleUI();
      updateGearButton();
      updateSpoilerButton();
      updateBrakeButton();

      if (show) showMessage("Uçak piste alındı.");
    }

    function selectAircraft(id) {
      if (!saveData.owned.includes(id)) return;

      saveData.active = id;
      currentAircraft = getAircraft(id);
      saveGame();

      if (airplane) scene.remove(airplane);
      airplane = createAircraftModel(id);
      scene.add(airplane);

      resetPlane(false);
      renderMarket();
      updateHUD();
      showMessage(currentAircraft.name + " seçildi.");
    }

    function renderMarket() {
      marketGrid.innerHTML = "";

      for (const p of aircraftCatalog) {
        const owned = saveData.owned.includes(p.id);
        const active = saveData.active === p.id;

        const card = document.createElement("div");
        card.className = "planeCard" + (active ? " activeCard" : "");

        card.innerHTML = `
          <div class="planeName">${p.name}</div>
          <div class="planeType">${p.type}</div>

          <div class="stat">Hız
            <div class="statLine"><div class="statFill" style="width:${p.statSpeed}%"></div></div>
          </div>

          <div class="stat">Kontrol
            <div class="statLine"><div class="statFill" style="width:${p.statHandling}%"></div></div>
          </div>

          <div class="stat">Kaldırma
            <div class="statLine"><div class="statFill" style="width:${p.statLift}%"></div></div>
          </div>

          <div class="planePrice">${owned ? "Sahip olundu" : p.price + " coin"}</div>
        `;

        const btn = document.createElement("button");

        if (active) {
          btn.textContent = "Seçili";
          btn.className = "active";
        } else if (owned) {
          btn.textContent = "Bu Uçağı Seç";
          btn.onclick = () => selectAircraft(p.id);
        } else {
          btn.textContent = "Satın Al";
          btn.onclick = () => {
            if (saveData.coins < p.price) {
              showMessage("Yeterli coin yok. Uçarak coin kazan.");
              return;
            }

            saveData.coins -= p.price;
            saveData.owned.push(p.id);
            saveGame();
            selectAircraft(p.id);
          };
        }

        card.appendChild(btn);
        marketGrid.appendChild(card);
      }

      coinsHud.textContent = Math.floor(saveData.coins);
    }

    function updateThrottleUI() {
      const p = Math.round(state.throttle * 100);
      throttleFill.style.height = `${p}%`;
      throttleKnob.style.bottom = `${p}%`;
      throttleValue.textContent = `${p}%`;
      throttleHud.textContent = p;
    }

    function updateGearButton() {
      gearBtn.textContent = state.gearDown ? "Gear Açık" : "Gear Kapalı";
      gearBtn.classList.toggle("active", state.gearDown);
      gearHud.textContent = state.gearDown ? "Açık" : "Kapalı";
    }

    function updateSpoilerButton() {
      const active = getSpoilersActive();
      spoilerBtn.classList.toggle("active", active);
      spoilerHud.textContent =
        state.autoSpoilerTimer > 0
          ? "Ground Auto"
          : state.spoilersManual
            ? "Açık"
            : "Kapalı";
    }

    function updateBrakeButton() {
      brakeBtn.classList.toggle("holdActive", state.brake);
      brakeHud.textContent = state.brake ? "Açık" : "Kapalı";
    }

    let throttleDragging = false;

    throttleTrack.addEventListener("pointerdown", e => {
      throttleDragging = true;
      setThrottleFromPointer(e);
    });

    window.addEventListener("pointermove", e => {
      if (throttleDragging) setThrottleFromPointer(e);
    });

    window.addEventListener("pointerup", () => {
      throttleDragging = false;
    });

    function setThrottleFromPointer(e) {
      const rect = throttleTrack.getBoundingClientRect();
      const y = clamp(e.clientY, rect.top, rect.bottom);
      const p = 1 - (y - rect.top) / rect.height;
      state.throttle = clamp(p, 0, 1);
      updateThrottleUI();
    }

    let yokeActive = false;

    yokeBase.addEventListener("pointerdown", e => {
      yokeActive = true;
      yokeBase.setPointerCapture(e.pointerId);
      updateYoke(e);
    });

    yokeBase.addEventListener("pointermove", e => {
      if (yokeActive) updateYoke(e);
    });

    yokeBase.addEventListener("pointerup", () => {
      yokeActive = false;
    });

    yokeBase.addEventListener("pointercancel", () => {
      yokeActive = false;
    });

    function updateYoke(e) {
      const rect = yokeBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = clamp((e.clientX - cx) / (rect.width * 0.40), -1, 1);
      const dy = clamp((e.clientY - cy) / (rect.height * 0.40), -1, 1);

      state.yokeX = dx;
      state.yokeY = dy;

      const rotate = dx * 42;
      const moveX = dx * 18;
      const moveY = dy * 18;

      yoke.style.transform =
        `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) rotate(${rotate}deg)`;
    }

    function relaxYoke() {
      if (yokeActive) return;

      state.yokeX = lerp(state.yokeX, 0, 0.08);
      state.yokeY = lerp(state.yokeY, 0, 0.08);

      const rotate = state.yokeX * 42;
      const moveX = state.yokeX * 18;
      const moveY = state.yokeY * 18;

      yoke.style.transform =
        `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) rotate(${rotate}deg)`;
    }

    const rudderLeft = document.getElementById("rudderLeft");
    const rudderRight = document.getElementById("rudderRight");

    function bindHold(btn, onDown, onUp) {
      btn.addEventListener("pointerdown", e => {
        e.preventDefault();
        onDown();
      });

      btn.addEventListener("pointerup", e => {
        e.preventDefault();
        onUp();
      });

      btn.addEventListener("pointerleave", onUp);
      btn.addEventListener("pointercancel", onUp);
    }

    bindHold(rudderLeft, () => state.rudder = -1, () => state.rudder = 0);
    bindHold(rudderRight, () => state.rudder = 1, () => state.rudder = 0);

    bindHold(
      brakeBtn,
      () => {
        state.brake = true;
        updateBrakeButton();
      },
      () => {
        state.brake = false;
        updateBrakeButton();
      }
    );

    engineBtn.addEventListener("click", e => {
      state.engineOn = !state.engineOn;
      e.target.textContent = state.engineOn ? "Motor Açık" : "Motor Kapalı";
      e.target.classList.toggle("active", state.engineOn);
      e.target.classList.toggle("warn", !state.engineOn);
    });

    gearBtn.addEventListener("click", () => {
      if (!state.airborne && state.speed > 35) {
        showMessage("Yerde hareket ederken iniş takımı kapatılamaz.");
        return;
      }

      state.gearDown = !state.gearDown;
      updateGearButton();
    });

    spoilerBtn.addEventListener("click", () => {
      state.spoilersManual = !state.spoilersManual;
      if (state.spoilersManual && state.airborne) {
        showMessage("Spoiler açık: süzülme azalır, iniş hızlanır.");
      }
      updateSpoilerButton();
    });

    yawBtn.addEventListener("click", e => {
      state.yawDamper = !state.yawDamper;
      e.target.classList.toggle("active", state.yawDamper);
      yawHud.textContent = state.yawDamper ? "Açık" : "Kapalı";
    });

    document.getElementById("resetBtn").addEventListener("click", () => resetPlane(true));

    document.getElementById("marketBtn").addEventListener("click", () => {
      renderMarket();
      marketOverlay.style.display = "block";
    });

    document.getElementById("closeMarketBtn").addEventListener("click", () => {
      marketOverlay.style.display = "none";
    });

    function updateGearAnimation() {
      const gear = airplane.userData.gearGroup;
      if (!gear) return;

      const targetY = state.gearDown ? gear.userData.extendedY : gear.userData.retractedY;
      gear.position.y = lerp(gear.position.y, targetY, 0.075);

      const nearlyRetracted = Math.abs(gear.position.y - gear.userData.retractedY) < 0.35;
      gear.visible = state.gearDown || !nearlyRetracted;
    }

    function updateEngineVisuals(dt) {
      const spin = (state.engineOn ? 12 + state.throttle * 90 : 2.2) * dt;

      for (const part of airplane.userData.engineParts || []) {
        part.rotation.z += spin;

        if (part.material && part.material.opacity !== undefined && currentAircraft.id === "f16") {
          part.material.opacity = state.engineOn && state.throttle > 0.45 ? 0.58 : 0.15;
        }
      }
    }

    function updatePhysics(dt) {
      relaxYoke();

      const cfg = currentAircraft;
      const groundY = groundContactY(airplane.position.x, airplane.position.z);
      const airportSurface = isOnAirportSurface(airplane.position.x, airplane.position.z);
      const runwaySurface = isOnRunway(airplane.position.x, airplane.position.z);
      const spoilersActive = getSpoilersActive();

      if (state.autoSpoilerTimer > 0) {
        state.autoSpoilerTimer = Math.max(0, state.autoSpoilerTimer - dt);
      }

      const engineThrottle = state.engineOn ? state.throttle : 0;
      const speedRatio = clamp(state.speed / cfg.maxSpeed, 0, 1.2);

      const thrustAccel = engineThrottle * cfg.accel * (1 - Math.min(0.72, speedRatio * 0.65));
      const airDrag = cfg.drag * state.speed * state.speed;
      const gearDrag = state.gearDown ? 0.000018 * state.speed * state.speed : 0.000005 * state.speed * state.speed;
      const spoilerDrag = spoilersActive ? 0.000075 * state.speed * state.speed : 0;
      const rollingFriction = state.airborne ? 0 : airportSurface ? 0.55 : 2.2;
      const brakeDecel = state.brake ? (state.airborne ? 0.9 : cfg.brakePower) : 0;
      const groundSpoilerDecel = !state.airborne && state.autoSpoilerTimer > 0 ? cfg.brakePower * 0.30 : 0;

      const acceleration =
        thrustAccel -
        airDrag -
        gearDrag -
        spoilerDrag -
        rollingFriction -
        brakeDecel -
        groundSpoilerDecel;

      state.speed = clamp(state.speed + acceleration * dt, 0, cfg.maxSpeed * 1.04);

      state.altitude = Math.max(0, airplane.position.y - groundY);

      if (!state.airborne && state.altitude > 1.8) {
        state.airborne = true;
      }

      if (!state.airborne) {
        airplane.position.y = groundY;

        state.pitch = lerp(state.pitch, 0, 0.16);
        state.roll = lerp(state.roll, 0, 0.20);

        const taxiGrip = airportSurface ? 1.0 : 0.38;
        const brakingGripLoss = state.brake && state.speed > 70 ? 0.55 : 1.0;
        state.yaw += state.rudder * state.speed * 0.00050 * taxiGrip * brakingGripLoss;

        if (state.speed > cfg.takeoffSpeed && state.yokeY > 0.16 && runwaySurface && !state.brake) {
          state.airborne = true;
          state.pitch = -0.070;
          airplane.position.y += 1.15;
        }
      } else {
        const authority = clamp((state.speed - cfg.takeoffSpeed * 0.45) / (cfg.takeoffSpeed * 1.15), 0.10, 1.0);
        const handling = cfg.handling;

        const targetPitch = -state.yokeY * 0.36 * authority * handling;
        const targetRoll = -state.yokeX * 0.78 * authority * handling;

        state.pitch = lerp(state.pitch, targetPitch, 0.052);
        state.roll = lerp(state.roll, targetRoll, 0.068);

        let yawInput = state.rudder * 0.55 + state.roll * -0.40;

        if (state.yawDamper) {
          yawInput *= 0.42;
          state.roll = lerp(state.roll, 0, 0.010);
        }

        state.yaw += yawInput * dt * authority * handling;

        const takeoffRatio = state.speed / cfg.takeoffSpeed;
        const lift = Math.max(0, takeoffRatio * takeoffRatio) * cfg.lift;
        const pitchVertical = -state.pitch * state.speed * 0.040 * cfg.climb;
        const engineLiftBonus = engineThrottle * cfg.lift * 0.11;
        const spoilerSink = spoilersActive ? 1.25 + takeoffRatio * 0.75 : 0;

        const verticalSpeed =
          lift +
          pitchVertical +
          engineLiftBonus -
          cfg.gravity -
          spoilerSink;

        airplane.position.y += verticalSpeed * dt * 2.45;

        const newGroundY = groundContactY(airplane.position.x, airplane.position.z);

        if (airplane.position.y <= newGroundY) {
          airplane.position.y = newGroundY;

          const unsafeLanding =
            state.speed > cfg.landingMax ||
            Math.abs(state.roll) > 0.48 ||
            Math.abs(state.pitch) > 0.42 ||
            !state.gearDown ||
            !runwaySurface;

          if (unsafeLanding && state.speed > 55) {
            state.crashed = true;
            state.speed *= 0.18;
            showMessage("Sert iniş / kaza! Reset'e bas.");
          } else {
            if (state.lastWasAirborne && state.speed > 55) {
              state.autoSpoilerTimer = 5.5;
              showMessage("İniş başarılı! Ground spoilers otomatik açıldı.");
            }
          }

          state.airborne = false;
          state.pitch = lerp(state.pitch, 0, 0.25);
          state.roll = lerp(state.roll, 0, 0.25);
        }
      }

      if (state.crashed) {
        state.throttle = 0;
        state.spoilersManual = false;
        state.brake = false;
        state.speed = lerp(state.speed, 0, 0.060);
        updateThrottleUI();
      }

      const forward = new THREE.Vector3(
        Math.sin(state.yaw),
        0,
        -Math.cos(state.yaw)
      );

      const distanceMeters = (state.speed / 3.6) * dt;
      airplane.position.addScaledVector(forward, distanceMeters);

      airplane.rotation.order = "YXZ";
      airplane.rotation.y = state.yaw;
      airplane.rotation.x = state.pitch;
      airplane.rotation.z = state.roll;

      updateGearAnimation();
      updateEngineVisuals(dt);

      if (state.airborne && !state.crashed) {
        state.coinBuffer += dt * (state.speed / 130) * cfg.reward;

        if (state.coinBuffer >= 1) {
          const earned = Math.floor(state.coinBuffer);
          state.coinBuffer -= earned;
          saveData.coins += earned;
          coinsHud.textContent = Math.floor(saveData.coins);
          saveGame();
        }
      }

      state.lastWasAirborne = state.airborne;

      updateSpoilerButton();
      updateBrakeButton();
      updateCamera(dt);
      updateHUD();
    }

    function updateCamera(dt) {
      const distance = currentAircraft.id === "b747" ? 125 : currentAircraft.id === "f16" ? 72 : 88;
      const height = currentAircraft.id === "b747" ? 48 : 33;

      const behind = new THREE.Vector3(
        -Math.sin(state.yaw) * distance,
        height,
        Math.cos(state.yaw) * distance
      );

      const desired = airplane.position.clone().add(behind);
      camera.position.lerp(desired, 1 - Math.pow(0.001, dt));

      const lookAt = airplane.position.clone();
      lookAt.y += currentAircraft.groundClearance + 4;
      camera.lookAt(lookAt);
    }

    function updateHUD() {
      speedEl.textContent = Math.round(state.speed);
      altEl.textContent = Math.round(state.altitude);
      throttleHud.textContent = Math.round(state.throttle * 100);
      gearHud.textContent = state.gearDown ? "Açık" : "Kapalı";
      yawHud.textContent = state.yawDamper ? "Açık" : "Kapalı";
      planeHud.textContent = currentAircraft.name;
      coinsHud.textContent = Math.floor(saveData.coins);

      if (state.crashed) {
        statusEl.textContent = "Kaza yaptı";
        statusEl.style.color = "#ff7777";
      } else if (!state.engineOn) {
        statusEl.textContent = state.airborne ? "Motor kapalı - süzülüyor" : "Motor kapalı";
        statusEl.style.color = "#ffaaaa";
      } else if (!state.airborne && state.speed < 5) {
        statusEl.textContent = "Park halinde";
        statusEl.style.color = "#ffe58a";
      } else if (!state.airborne) {
        statusEl.textContent = isOnAirportSurface(airplane.position.x, airplane.position.z)
          ? "Yerde ilerliyor"
          : "Arazide ilerliyor";
        statusEl.style.color = "#ffe58a";
      } else if (state.throttle < 0.05) {
        statusEl.textContent = "Gaz kesildi - momentumla süzülüyor";
        statusEl.style.color = "#c7f7ff";
      } else {
        statusEl.textContent = "Uçuşta";
        statusEl.style.color = "#9effa8";
      }
    }

    const keys = {};

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    function updateKeyboard(dt) {
      if (keys["w"]) state.throttle = clamp(state.throttle + dt * 0.42, 0, 1);
      if (keys["s"]) state.throttle = clamp(state.throttle - dt * 0.42, 0, 1);

      if (keys["arrowleft"]) state.yokeX = clamp(state.yokeX - dt * 2.2, -1, 1);
      if (keys["arrowright"]) state.yokeX = clamp(state.yokeX + dt * 2.2, -1, 1);
      if (keys["arrowup"]) state.yokeY = clamp(state.yokeY - dt * 2.2, -1, 1);
      if (keys["arrowdown"]) state.yokeY = clamp(state.yokeY + dt * 2.2, -1, 1);

      if (keys["a"]) state.rudder = -1;
      else if (keys["d"]) state.rudder = 1;
      else if (!rudderLeft.matches(":active") && !rudderRight.matches(":active")) state.rudder = 0;

      state.brake = !!(keys[" "] || keys["b"]);

      updateThrottleUI();
    }

    createTerrain();
    createAirportSurfaces();
    createAirportObjects();
    createClouds();

    selectAircraft(saveData.active);
    renderMarket();

    let last = performance.now();

    function animate(now) {
      const dt = Math.min(0.035, (now - last) / 1000);
      last = now;

      updateKeyboard(dt);
      updatePhysics(dt);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate(performance.now());

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, lowPowerDevice ? 1.25 : 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
